<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Light Squircle Background Gradient -->
    <linearGradient id="bgGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>

    <!-- 3 Data Pulse Bars Gradients (Smooth Progression on Light Canvas) -->
    <linearGradient id="barGrad1Light" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FFEDD5" />
      <stop offset="100%" stop-color="#FDBA74" />
    </linearGradient>

    <linearGradient id="barGrad2Light" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FED7AA" />
      <stop offset="100%" stop-color="#FB923C" />
    </linearGradient>

    <linearGradient id="barGrad3Light" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FDBA74" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>

    <!-- Main V-Checkmark Sunset Orange Gradient -->
    <linearGradient id="vCheckGradLight" x1="15%" y1="65%" x2="85%" y2="25%">
      <stop offset="0%" stop-color="#C2410C" />
      <stop offset="35%" stop-color="#EA580C" />
      <stop offset="75%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#FB923C" />
    </linearGradient>

    <!-- 3D Glass Surface Highlight -->
    <linearGradient id="wingHighlightLight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#FED7AA" stop-opacity="0.2" />
    </linearGradient>

    <!-- Gold Diamond Star Gradient -->
    <linearGradient id="goldGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="40%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Soft Drop Shadow Filters -->
    <filter id="squircleShadowLight" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.05" />
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity="0.04" />
    </filter>

    <filter id="vShadowLight" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#EA580C" flood-opacity="0.2" />
    </filter>

    <filter id="starGlowLight" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="glow" />
      <feComposite in="SourceGraphic" in2="glow" operator="over" />
    </filter>
  </defs>

  <!-- 1. Base Squircle Frame (Apple/Bento Standard 480x480, rx=112) -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGradLight)" stroke="#E4E4E7" stroke-width="3" filter="url(#squircleShadowLight)" />

  <!-- 2. Warm Ambient Radial Glow -->
  <circle cx="280" cy="270" r="170" fill="#EA580C" opacity="0.06" filter="blur(40px)" />
  <circle cx="380" cy="160" r="100" fill="#F59E0B" opacity="0.08" filter="blur(35px)" />

  <!-- 3. Pulse Survey Data Bars (Tượng trưng cho dữ liệu & nhịp điệu khảo sát) -->
  <g>
    <!-- Bar 1 -->
    <rect x="108" y="266" width="18" height="58" rx="9" fill="url(#barGrad1Light)" />
    <!-- Bar 2 -->
    <rect x="136" y="228" width="18" height="96" rx="9" fill="url(#barGrad2Light)" />
    <!-- Bar 3 -->
    <rect x="164" y="190" width="18" height="134" rx="9" fill="url(#barGrad3Light)" />
  </g>

  <!-- 4. Main V-Checkmark (Xác thực khảo sát hoàn thành - Survey Validation) -->
  <!-- Shadow layer for depth -->
  <path d="M 174 268 L 246 364 C 252 372, 264 372, 270 364 L 384 174" 
        fill="none" 
        stroke="#C2410C" 
        stroke-width="46" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        opacity="0.18" 
        filter="url(#vShadowLight)" />

  <!-- Main Body -->
  <path d="M 174 268 L 246 364 C 252 372, 264 372, 270 364 L 384 174" 
        fill="none" 
        stroke="url(#vCheckGradLight)" 
        stroke-width="46" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- 5. Glassmorphism Highlight Ridge (Chiều sâu tinh xảo 3D) -->
  <path d="M 177 266 L 246 358 C 250 363, 258 363, 262 358 L 380 170" 
        fill="none" 
        stroke="url(#wingHighlightLight)" 
        stroke-width="11" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- 6. Reward Diamond Star (Ngôi sao phần thưởng 4 cánh) -->
  <g transform="translate(394, 138)" filter="url(#starGlowLight)">
    <!-- 4-Point Diamond Sparkle -->
    <path d="M 0 -38 C 2.5 -12, 12 -2.5, 38 0 C 12 2.5, 2.5 12, 0 38 C -2.5 12, -12 2.5, -38 0 C -12 -2.5, -2.5 -12, 0 -38 Z" 
          fill="url(#goldGradLight)" />
    <!-- Bright Center Core -->
    <circle cx="0" cy="0" r="7.5" fill="#FFFFFF" />
    <circle cx="0" cy="0" r="16" fill="#FDE047" opacity="0.35" filter="blur(3px)" />
  </g>

  <!-- 7. Minor Accent Sparkle (Cân bằng thị giác) -->
  <g transform="translate(138, 166) scale(0.38)" opacity="0.85">
    <path d="M 0 -30 C 2 -8, 8 -2, 30 0 C 8 2, 2 8, 0 30 C -2 8, -8 2, -30 0 C -8 -2, -2 -8, 0 -30 Z" 
          fill="#FB923C" />
  </g>
</svg>
