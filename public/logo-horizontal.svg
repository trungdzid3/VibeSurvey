<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 160" width="100%" height="100%">
  <defs>
    <!-- Background Gradient for Icon Container -->
    <linearGradient id="hzBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#0B0F19" />
    </linearGradient>

    <!-- Main V Checkmark Gradient -->
    <linearGradient id="hzVCheckGrad" x1="15%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="35%" stop-color="#4F46E5" />
      <stop offset="70%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Inner Highlight -->
    <linearGradient id="hzWingHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A5F3FC" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.1" />
    </linearGradient>

    <!-- Gold Sparkle -->
    <linearGradient id="hzGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="45%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Pulse Bars -->
    <linearGradient id="hzPulseGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.9" />
    </linearGradient>

    <!-- Wordmark Survey Gradient -->
    <linearGradient id="textSurveyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Filter Glow -->
    <filter id="hzGoldGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left: The Brand Icon Mark (Scaled down from 512 to 136) -->
  <g transform="translate(14, 12)">
    <!-- Squircle Frame -->
    <rect x="0" y="0" width="136" height="136" rx="34" fill="url(#hzBgGrad)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5" />
    
    <!-- Ambient Light -->
    <circle cx="68" cy="65" r="45" fill="#4F46E5" opacity="0.22" filter="blur(14px)" />
    <circle cx="98" cy="40" r="25" fill="#06B6D4" opacity="0.25" filter="blur(10px)" />

    <!-- Pulse Bars -->
    <g opacity="0.85">
      <rect x="29" y="72" width="4.5" height="14" rx="2" fill="url(#hzPulseGrad)" />
      <rect x="36" y="62" width="4.5" height="26" rx="2" fill="url(#hzPulseGrad)" />
      <rect x="43" y="55" width="4.5" height="36" rx="2" fill="url(#hzPulseGrad)" />
    </g>

    <!-- Main V Checkmark -->
    <path d="M 46 72 L 66 99 C 67.5 101, 70.5 101, 72 99 L 102 48" 
          fill="none" 
          stroke="url(#hzVCheckGrad)" 
          stroke-width="12" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Highlight Reflection -->
    <path d="M 47 71 L 66 97 C 67 98.5, 69 98.5, 70 97 L 101 47" 
          fill="none" 
          stroke="url(#hzWingHighlight)" 
          stroke-width="3.2" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Reward Sparkle Star -->
    <g transform="translate(104, 38)" filter="url(#hzGoldGlow)">
      <path d="M 0 -11 C 0.8 -3, 3 -0.8, 11 0 C 3 0.8, 0.8 3, 0 11 C -0.8 3, -3 0.8, -11 0 C -3 -0.8, -0.8 -3, 0 -11 Z" 
            fill="url(#hzGoldGrad)" />
      <circle cx="0" cy="0" r="2.2" fill="#FFFFFF" />
    </g>
  </g>

  <!-- Right: The Brand Wordmark Typography -->
  <g transform="translate(176, 32)">
    <!-- App Name: VibeSurvey -->
    <text x="0" y="62" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="58" font-weight="800" letter-spacing="-1.5">
      <tspan fill="#0F172A" class="dark-invert" id="vibe-text">Vibe</tspan><tspan fill="url(#textSurveyGrad)">Survey</tspan>
    </text>

    <!-- Badge: PRO PLATFORM / REWARD ECOSYSTEM -->
    <g transform="translate(352, 22)">
      <rect x="0" y="0" width="84" height="24" rx="12" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1" />
      <text x="42" y="16" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#4F46E5" text-anchor="middle" letter-spacing="0.5">ECOSYSTEM</text>
    </g>

    <!-- Tagline: Khảo Sát • Tích Điểm • Đổi Thưởng -->
    <text x="2" y="98" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="16.5" font-weight="600" fill="#64748B" letter-spacing="0.2">
      Nền tảng Khảo sát Trực tuyến &amp; Đổi thưởng Siêu tốc
    </text>
  </g>
</svg>