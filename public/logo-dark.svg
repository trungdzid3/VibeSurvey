<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dark Squircle Obsidian Background Gradient -->
    <linearGradient id="bgGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1E24" />
      <stop offset="60%" stop-color="#161619" />
      <stop offset="100%" stop-color="#121214" />
    </linearGradient>

    <!-- 3 Data Pulse Bars Gradients (Vibrant on Dark Obsidian) -->
    <linearGradient id="barGrad1Dark" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#7C2D12" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>

    <linearGradient id="barGrad2Dark" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#9A3412" />
      <stop offset="100%" stop-color="#F97316" />
    </linearGradient>

    <linearGradient id="barGrad3Dark" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#C2410C" />
      <stop offset="100%" stop-color="#FB923C" />
    </linearGradient>

    <!-- Main V-Checkmark Sunset Orange to Gold Gradient -->
    <linearGradient id="vCheckGradDark" x1="15%" y1="65%" x2="85%" y2="25%">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="40%" stop-color="#F97316" />
      <stop offset="80%" stop-color="#FB923C" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>

    <!-- 3D Glass Surface Highlight -->
    <linearGradient id="wingHighlightDark" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#FDE047" stop-opacity="0.2" />
    </linearGradient>

    <!-- Glowing Reward Diamond Star Gradient -->
    <linearGradient id="goldGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="45%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="squircleShadowDark" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <filter id="glowEffectDark" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="starGlowDark" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="starBlur" />
      <feComponentTransfer in="starBlur" result="boostedBlur">
        <feFuncA type="linear" slope="1.4" />
      </feComponentTransfer>
      <feComposite in="SourceGraphic" in2="boostedBlur" operator="over" />
    </filter>
  </defs>

  <!-- 1. Base Squircle Frame (Obsidian #1E1E24 -> #121214, Border #2E2E36) -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGradDark)" stroke="#2E2E36" stroke-width="3" filter="url(#squircleShadowDark)" />

  <!-- 2. Ambient Sunset Glow inside the Container -->
  <circle cx="270" cy="260" r="190" fill="#EA580C" opacity="0.22" filter="blur(45px)" />
  <circle cx="390" cy="150" r="110" fill="#F59E0B" opacity="0.26" filter="blur(35px)" />

  <!-- 3. Pulse Survey Data Bars (Tượng trưng cho nhịp điệu & dữ liệu khảo sát) -->
  <g>
    <!-- Bar 1 -->
    <rect x="108" y="266" width="18" height="58" rx="9" fill="url(#barGrad1Dark)" />
    <!-- Bar 2 -->
    <rect x="136" y="228" width="18" height="96" rx="9" fill="url(#barGrad2Dark)" />
    <!-- Bar 3 -->
    <rect x="164" y="190" width="18" height="134" rx="9" fill="url(#barGrad3Dark)" />
  </g>

  <!-- 4. Main V-Checkmark (Xác thực khảo sát hoàn thành - Survey Validation) -->
  <!-- Ambient Neon Underglow -->
  <path d="M 174 268 L 246 364 C 252 372, 264 372, 270 364 L 384 174" 
        fill="none" 
        stroke="#EA580C" 
        stroke-width="52" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        opacity="0.45" 
        filter="url(#glowEffectDark)" />

  <!-- Main Body -->
  <path d="M 174 268 L 246 364 C 252 372, 264 372, 270 364 L 384 174" 
        fill="none" 
        stroke="url(#vCheckGradDark)" 
        stroke-width="46" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- 5. Glassmorphism Highlight Ridge (Chiều sâu tinh xảo 3D) -->
  <path d="M 177 266 L 246 358 C 250 363, 258 363, 262 358 L 380 170" 
        fill="none" 
        stroke="url(#wingHighlightDark)" 
        stroke-width="11" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- 6. Reward Diamond Star (Ngôi sao phần thưởng 4 cánh) -->
  <g transform="translate(394, 138)" filter="url(#starGlowDark)">
    <!-- 4-Point Diamond Sparkle -->
    <path d="M 0 -38 C 2.5 -12, 12 -2.5, 38 0 C 12 2.5, 2.5 12, 0 38 C -2.5 12, -12 2.5, -38 0 C -12 -2.5, -2.5 -12, 0 -38 Z" 
          fill="url(#goldGradDark)" />
    <!-- Bright Center Core -->
    <circle cx="0" cy="0" r="7.5" fill="#FFFFFF" />
    <circle cx="0" cy="0" r="16" fill="#FEF08A" opacity="0.45" filter="blur(3px)" />
  </g>

  <!-- 7. Minor Accent Sparkle (Cân bằng thị giác) -->
  <g transform="translate(138, 166) scale(0.38)" opacity="0.9">
    <path d="M 0 -30 C 2 -8, 8 -2, 30 0 C 8 2, 2 8, 0 30 C -2 8, -8 2, -30 0 C -8 -2, -2 -8, 0 -30 Z" 
          fill="#FBBF24" />
  </g>
</svg>
