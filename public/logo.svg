<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#0B0F19" />
    </linearGradient>

    <!-- Main V Checkmark Gradient -->
    <linearGradient id="vCheckGrad" x1="15%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="35%" stop-color="#4F46E5" />
      <stop offset="70%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Wing Highlight Gradient -->
    <linearGradient id="wingHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A5F3FC" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.1" />
    </linearGradient>

    <!-- Gold Reward Sparkle Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="45%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Pulse Bar Gradient -->
    <linearGradient id="pulseGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.9" />
    </linearGradient>

    <!-- Drop Shadows and Glow Filters -->
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="goldGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="goldBlur" />
      <feComponentTransfer in="goldBlur" result="boostedBlur">
        <feFuncA type="linear" slope="1.5" />
      </feComponentTransfer>
      <feComposite in="SourceGraphic" in2="boostedBlur" operator="over" />
    </filter>

    <filter id="innerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Base Squircle Background -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="3" filter="url(#innerShadow)" />

  <!-- Subtle Radial Ambient Light inside the container -->
  <circle cx="256" cy="240" r="180" fill="#4F46E5" opacity="0.18" filter="blur(50px)" />
  <circle cx="370" cy="160" r="90" fill="#06B6D4" opacity="0.22" filter="blur(40px)" />

  <!-- Vibe Dynamic Soundwave / Survey Data Bars (Tượng trưng cho dữ liệu & Vibe) -->
  <g opacity="0.85">
    <!-- Bar 1 -->
    <rect x="110" y="270" width="16" height="50" rx="8" fill="url(#pulseGrad)" />
    <!-- Bar 2 -->
    <rect x="136" y="235" width="16" height="95" rx="8" fill="url(#pulseGrad)" />
    <!-- Bar 3 -->
    <rect x="162" y="210" width="16" height="130" rx="8" fill="url(#pulseGrad)" />
  </g>

  <!-- Glow under the main V-Checkmark -->
  <path d="M 172 268 L 246 364 C 252 372, 264 372, 270 364 L 382 178" 
        fill="none" 
        stroke="#4F46E5" 
        stroke-width="52" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        opacity="0.45" 
        filter="url(#glowEffect)" />

  <!-- Main V Checkmark (The Core Symbol of Survey Validation) -->
  <path d="M 172 268 L 246 364 C 252 372, 264 372, 270 364 L 382 178" 
        fill="none" 
        stroke="url(#vCheckGrad)" 
        stroke-width="44" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Inner Highlight Reflection for 3D Modern Glass Finish -->
  <path d="M 175 266 L 246 358 C 250 363, 258 363, 262 358 L 378 174" 
        fill="none" 
        stroke="url(#wingHighlight)" 
        stroke-width="12" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Reward Sparkle / Diamond Star (Biểu tượng Điểm Thưởng & Thu Nhập) -->
  <g transform="translate(390, 140)" filter="url(#goldGlow)">
    <!-- 4-Point Diamond Sparkle -->
    <path d="M 0 -36 C 2 -10, 10 -2, 36 0 C 10 2, 2 10, 0 36 C -2 10, -10 2, -36 0 C -10 -2, -2 -10, 0 -36 Z" 
          fill="url(#goldGrad)" />
    <!-- Center Bright Core -->
    <circle cx="0" cy="0" r="7" fill="#FFFFFF" opacity="0.95" />
    <circle cx="0" cy="0" r="14" fill="#FEF08A" opacity="0.45" filter="blur(3px)" />
  </g>

  <!-- Minor Accent Sparkle -->
  <g transform="translate(142, 180) scale(0.42)" opacity="0.75">
    <path d="M 0 -30 C 2 -8, 8 -2, 30 0 C 8 2, 2 8, 0 30 C -2 8, -8 2, -30 0 C -8 -2, -2 -8, 0 -30 Z" 
          fill="#38BDF8" />
  </g>
</svg>