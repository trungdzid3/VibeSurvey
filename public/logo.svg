<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <style>
      .theme-dark-layer { display: none; }
      .theme-light-layer { display: block; }
      @media (prefers-color-scheme: dark) {
        .theme-dark-layer { display: block; }
        .theme-light-layer { display: none; }
      }
    </style>

    <!-- ==================== LIGHT THEME ASSETS ==================== -->
    <linearGradient id="bgGradL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>

    <linearGradient id="barGrad1L" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FFEDD5" />
      <stop offset="100%" stop-color="#FDBA74" />
    </linearGradient>
    <linearGradient id="barGrad2L" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FED7AA" />
      <stop offset="100%" stop-color="#FB923C" />
    </linearGradient>
    <linearGradient id="barGrad3L" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FDBA74" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>

    <linearGradient id="vCheckGradL" x1="15%" y1="65%" x2="85%" y2="25%">
      <stop offset="0%" stop-color="#C2410C" />
      <stop offset="35%" stop-color="#EA580C" />
      <stop offset="75%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#FB923C" />
    </linearGradient>

    <linearGradient id="wingHighlightL" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#FED7AA" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="goldGradL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="40%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <filter id="squircleShadowL" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.05" />
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity="0.04" />
    </filter>
    <filter id="vShadowL" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#EA580C" flood-opacity="0.2" />
    </filter>
    <filter id="starGlowL" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="glow" />
      <feComposite in="SourceGraphic" in2="glow" operator="over" />
    </filter>

    <!-- ==================== DARK THEME ASSETS ==================== -->
    <linearGradient id="bgGradD" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1E24" />
      <stop offset="60%" stop-color="#161619" />
      <stop offset="100%" stop-color="#121214" />
    </linearGradient>

    <linearGradient id="barGrad1D" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#7C2D12" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <linearGradient id="barGrad2D" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#9A3412" />
      <stop offset="100%" stop-color="#F97316" />
    </linearGradient>
    <linearGradient id="barGrad3D" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#C2410C" />
      <stop offset="100%" stop-color="#FB923C" />
    </linearGradient>

    <linearGradient id="vCheckGradD" x1="15%" y1="65%" x2="85%" y2="25%">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="40%" stop-color="#F97316" />
      <stop offset="80%" stop-color="#FB923C" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>

    <linearGradient id="wingHighlightD" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#FDE047" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="goldGradD" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="45%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <filter id="squircleShadowD" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>
    <filter id="glowEffectD" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="starGlowD" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="starBlur" />
      <feComponentTransfer in="starBlur" result="boostedBlur">
        <feFuncA type="linear" slope="1.4" />
      </feComponentTransfer>
      <feComposite in="SourceGraphic" in2="boostedBlur" operator="over" />
    </filter>
  </defs>

  <!-- ==================== 1. LIGHT THEME RENDER LAYER ==================== -->
  <g class="theme-light-layer">
    <!-- Squircle Frame -->
    <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGradL)" stroke="#E4E4E7" stroke-width="3" filter="url(#squircleShadowL)" />
    <!-- Ambient Glow -->
    <circle cx="280" cy="270" r="170" fill="#EA580C" opacity="0.06" filter="blur(40px)" />
    <circle cx="380" cy="160" r="100" fill="#F59E0B" opacity="0.08" filter="blur(35px)" />
    <!-- Pulse Bars -->
    <rect x="108" y="266" width="18" height="58" rx="9" fill="url(#barGrad1L)" />
    <rect x="136" y="228" width="18" height="96" rx="9" fill="url(#barGrad2L)" />
    <rect x="164" y="190" width="18" height="134" rx="9" fill="url(#barGrad3L)" />
    <!-- V-Checkmark Shadow -->
    <path d="M 174 268 L 246 364 C 252 372, 264 372, 270 364 L 384 174" 
          fill="none" stroke="#C2410C" stroke-width="46" stroke-linecap="round" stroke-linejoin="round" opacity="0.18" filter="url(#vShadowL)" />
    <!-- Main V-Checkmark -->
    <path d="M 174 268 L 246 364 C 252 372, 264 372, 270 364 L 384 174" 
          fill="none" stroke="url(#vCheckGradL)" stroke-width="46" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Glass Highlight -->
    <path d="M 177 266 L 246 358 C 250 363, 258 363, 262 358 L 380 170" 
          fill="none" stroke="url(#wingHighlightL)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Diamond Star -->
    <g transform="translate(394, 138)" filter="url(#starGlowL)">
      <path d="M 0 -38 C 2.5 -12, 12 -2.5, 38 0 C 12 2.5, 2.5 12, 0 38 C -2.5 12, -12 2.5, -38 0 C -12 -2.5, -2.5 -12, 0 -38 Z" fill="url(#goldGradL)" />
      <circle cx="0" cy="0" r="7.5" fill="#FFFFFF" />
      <circle cx="0" cy="0" r="16" fill="#FDE047" opacity="0.35" filter="blur(3px)" />
    </g>
    <!-- Minor Star -->
    <g transform="translate(138, 166) scale(0.38)" opacity="0.85">
      <path d="M 0 -30 C 2 -8, 8 -2, 30 0 C 8 2, 2 8, 0 30 C -2 8, -8 2, -30 0 C -8 -2, -2 -8, 0 -30 Z" fill="#FB923C" />
    </g>
  </g>

  <!-- ==================== 2. DARK THEME RENDER LAYER ==================== -->
  <g class="theme-dark-layer">
    <!-- Squircle Frame -->
    <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGradD)" stroke="#2E2E36" stroke-width="3" filter="url(#squircleShadowD)" />
    <!-- Ambient Glow -->
    <circle cx="270" cy="260" r="190" fill="#EA580C" opacity="0.22" filter="blur(45px)" />
    <circle cx="390" cy="150" r="110" fill="#F59E0B" opacity="0.26" filter="blur(35px)" />
    <!-- Pulse Bars -->
    <rect x="108" y="266" width="18" height="58" rx="9" fill="url(#barGrad1D)" />
    <rect x="136" y="228" width="18" height="96" rx="9" fill="url(#barGrad2D)" />
    <rect x="164" y="190" width="18" height="134" rx="9" fill="url(#barGrad3D)" />
    <!-- V-Checkmark Underglow -->
    <path d="M 174 268 L 246 364 C 252 372, 264 372, 270 364 L 384 174" 
          fill="none" stroke="#EA580C" stroke-width="52" stroke-linecap="round" stroke-linejoin="round" opacity="0.45" filter="url(#glowEffectD)" />
    <!-- Main V-Checkmark -->
    <path d="M 174 268 L 246 364 C 252 372, 264 372, 270 364 L 384 174" 
          fill="none" stroke="url(#vCheckGradD)" stroke-width="46" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Glass Highlight -->
    <path d="M 177 266 L 246 358 C 250 363, 258 363, 262 358 L 380 170" 
          fill="none" stroke="url(#wingHighlightD)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Diamond Star -->
    <g transform="translate(394, 138)" filter="url(#starGlowD)">
      <path d="M 0 -38 C 2.5 -12, 12 -2.5, 38 0 C 12 2.5, 2.5 12, 0 38 C -2.5 12, -12 2.5, -38 0 C -12 -2.5, -2.5 -12, 0 -38 Z" fill="url(#goldGradD)" />
      <circle cx="0" cy="0" r="7.5" fill="#FFFFFF" />
      <circle cx="0" cy="0" r="16" fill="#FEF08A" opacity="0.45" filter="blur(3px)" />
    </g>
    <!-- Minor Star -->
    <g transform="translate(138, 166) scale(0.38)" opacity="0.9">
      <path d="M 0 -30 C 2 -8, 8 -2, 30 0 C 8 2, 2 8, 0 30 C -2 8, -8 2, -30 0 C -8 -2, -2 -8, 0 -30 Z" fill="#FBBF24" />
    </g>
  </g>
</svg>
